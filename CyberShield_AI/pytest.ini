[pytest]
testpaths = tests
# test_pisf_agent.py is a legacy stub; tests live in test_pisf_reachability.py
addopts = --ignore=tests/test_pisf_agent.py -m "not live and not integration"
markers =
    live: test requires external network access or live API credentials
    integration: test requires a locally running container (DVWA, JuiceShop, etc.)
