name: Backend verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install declared dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Run offline tests
        run: python -m pytest -m 'not live and not integration'

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build locked runtime image
        run: docker build --tag cybershield-backend:ci .
      - name: Verify non-root runtime imports without network
        run: docker run --rm --network none --entrypoint python cybershield-backend:ci -c "import os, server; assert os.getuid() != 0"
